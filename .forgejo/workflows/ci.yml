name: CI

# Forgejo is the source of truth and owns versioning. This workflow validates
# every push and pull request, and on the default branch (main) it runs
# semantic-release AFTER the checks pass to compute the next version, bump the
# version files + CHANGELOG, commit `chore(release): vX.Y.Z`, and push a
# `vX.Y.Z` tag. It does NOT publish to npm and does NOT create a hosted Forgejo
# release — the commit + tag mirror to GitHub, and GitHub's tag workflow builds
# and publishes the package to npm (via OIDC) and creates the GitHub Release.
#
# The release commit intentionally carries NO `[skip ci]` marker: the tag points
# at that commit and the marker would follow the tag to GitHub, silently
# skipping the mirrored publish. Loop prevention comes from git tags instead —
# semantic-release derives the next version from the last `vX.Y.Z` tag, so when
# the release commit re-triggers CI the run finds zero commits since the fresh
# tag and exits as a harmless no-op.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Enforce the lockfile so CI matches local installs.
      - run: npm ci

      - name: Typecheck (core)
        run: npm run typecheck
      - name: Typecheck (viewer)
        run: npx tsc -p viewer/tsconfig.json

      - name: Unit + integration tests
        run: npm test

      - name: Build core + viewer
        run: npm run build

      # Verify the packed artifact contains the prebuilt viewer and does not
      # depend on source-only files.
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "viewer-dist/index.html" pack.txt
          grep -q "dist/cli.js" pack.txt

      # Smoke-test the packed package's bin from a throwaway directory with no
      # repo build artifacts on the path.
      - name: Smoke-test packed bin
        run: |
          PKG=$(npm pack --silent)
          TMP=$(mktemp -d)
          cp "$PKG" "$TMP/"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "./$PKG" >/dev/null
          npx codesafari --help
          npx codesafari dev --help || true
          # validate a tiny generated project
          mkdir -p proj/.tour
          printf -- '---\ntitle: Smoke\n---\nHi.\n' > proj/.tour/index.md
          npx codesafari validate proj

  # Versioning + tag only. Runs solely on trusted pushes to the default branch,
  # after build-and-test succeeds, and never on pull requests or other branches.
  release:
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize releases so two pushes cannot race to create a tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Fail fast with a clear message if the release credential is missing,
      # rather than letting semantic-release fail deep in verifyConditions.
      - name: Preflight — require release token
        env:
          SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$SEMANTIC_RELEASE_TOKEN" ]; then
            echo "::error::SEMANTIC_RELEASE_TOKEN is empty. Create it in the repo/org secrets: a token that can push the release commit to the protected default branch and push tags."
            exit 1
          fi

      # Check out the BRANCH (not a detached SHA) with full history + tags so
      # semantic-release can analyze commits and compute the next version from
      # the last tag. The token authenticates the release commit + tag push.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Configure release bot identity
        run: |
          git config user.name "codesafari-release[bot]"
          git config user.email "codesafari-release[bot]@users.noreply.git.tokenet.de"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install the pinned release tooling from the committed lockfile.
      - name: Install release tooling
        run: npm ci

      # --no-ci: without it, semantic-release falls back to a silent dry-run when
      # env-ci does not recognize the Forgejo runner, "succeeding" while creating
      # no tag. It is safe here because the job is already gated to trusted
      # default-branch pushes and the branch checkout makes the current branch
      # resolve correctly.
      # semantic-release pushes the release commit + tag over https, reusing the
      # auth header that actions/checkout configured from SEMANTIC_RELEASE_TOKEN.
      - name: Run semantic-release (compute version, commit, tag)
        run: npx semantic-release --no-ci
