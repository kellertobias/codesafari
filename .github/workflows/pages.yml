name: Deploy CodeSafari example to Pages

# Builds the viewer, exports this repository's own `.tour/` walkthrough into a
# self-contained static site (`codesafari export`), and deploys it to GitHub
# Pages. The viewer is built with a relative base, so it works under the
# project-pages subpath (https://kellertobias.github.io/codesafari/).
#
# Requires: Settings → Pages → Source = "GitHub Actions" (one-time, in the repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo; mint the Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    # GitHub-only (deploys to GitHub Pages). The Forgejo origin also reads
    # .github/workflows, so guard against it running there.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core + viewer
        run: npm run build

      - name: Export static site
        run: node dist/cli.js export . --out codesafari-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: codesafari-site

  deploy:
    name: Deploy to Pages
    needs: build
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
