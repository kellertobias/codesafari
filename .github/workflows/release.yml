name: Release

# GitHub is a push mirror of the Forgejo source of truth. Forgejo owns
# versioning: it runs semantic-release, bumps package.json / lockfile /
# CHANGELOG, commits `chore(release): vX.Y.Z`, and pushes a `vX.Y.Z` tag. That
# commit + tag mirror here, and THIS workflow — triggered by the `v*` tag —
# checks out the tag, builds the package, and publishes it to npm using OIDC
# trusted publishing (the GitHub Actions <-> npm trust relationship). No npm
# token is used anywhere; npm exchanges the GitHub OIDC identity for a
# short-lived credential and attaches build provenance automatically. It then
# creates a GitHub Release from the tag.
#
# The published version is whatever package.json holds at the tag — already
# bumped by Forgejo — so there is no version logic here and semantic-release
# does not run on GitHub.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # OIDC: mint the trusted-publishing credential for npm
  contents: write # create the GitHub Release from the tag

jobs:
  publish:
    name: Publish to npm (OIDC)
    # GitHub-only. The Forgejo origin also reads .github/workflows and creates
    # the `v*` tag, so guard against this running there. Two independent checks:
    # the server URL, and the repo slug (GitHub mirror is `kellertobias/...`,
    # Forgejo is `opensource/...`) so publishing can never fire on Forgejo even
    # if that instance reports a GitHub-compatible server_url.
    if: ${{ github.server_url == 'https://github.com' && github.repository == 'kellertobias/codesafari' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1. Pin the 11.x line: it
      # supports OIDC and runs on Node 22. (npm@latest is 12.x, which requires
      # Node >= 22.22.2 and would fail to install on the Node 22 line here.)
      - name: Upgrade npm (OIDC trusted publishing support)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build core + viewer
        run: npm run build

      # No NODE_AUTH_TOKEN / NPM_TOKEN in the environment: npm detects the GitHub
      # OIDC environment, exchanges it for a short-lived credential, and attaches
      # provenance. `--access public` because @tobisk/codesafari is a scoped,
      # public package.
      - name: Publish to npm
        run: npm publish --access public

      # Tag is `vX.Y.Z`; the npm version path uses `X.Y.Z`.
      - name: Derive npm version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Idempotent on re-runs: updates an existing release for the tag rather
      # than failing.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Published to npm: https://www.npmjs.com/package/@tobisk/codesafari/v/${{ steps.ver.outputs.version }}
