name: Release

# Publishes releases to GitHub (release + changelog) and npm using
# semantic-release. Runs from the repository root so @semantic-release/npm can
# find package.json. semantic-release derives the version from the Conventional
# Commits since the last release; the release commit it pushes is tagged
# [skip ci] so this workflow does not re-trigger itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release and push the release commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # OIDC for npm provenance

jobs:
  release:
    name: Semantic Release
    # GitHub-only (npm provenance + GitHub release). The Forgejo origin also
    # reads .github/workflows, so guard against it running there.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so semantic-release can analyze commits

      # No registry-url here: @semantic-release/npm configures the registry and
      # auth itself from NPM_TOKEN, and a setup-node .npmrc would shadow it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, test, build)
        run: |
          npm run typecheck
          npx tsc -p viewer/tsconfig.json
          npm test
          npm run build

      # semantic-release owns the whole release: version from the commits, tag,
      # GitHub release + changelog, and the npm publish (@semantic-release/npm,
      # with provenance via publishConfig). It publishes only when there is a
      # releasable commit, always at the version it just computed.
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
